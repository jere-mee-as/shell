<div id="app">
  <div id="fade"></div>
  <div id="grain"></div>
  <header id="top">
    <div id="hd">
      <div><button id="title" aria-label="Help">SHELL [HOME]&trade;</button></div>
      <div id="hdr"></div>
    </div>
    <div id="hero">
      <div id="stats"></div>
      <button id="clock" aria-label="Today's ledger"><span class="c1" id="ch">00</span><span class="c2"><i>:</i><span id="cm">00</span></span></button>
    </div>
  </header>
  <main id="ledger"><div class="sp" id="rows"></div></main>
  <section id="panel"></section>
  <footer id="dock">
    <div id="sug"></div>
    <div id="chips"></div>
    <div id="plabel">Next entry</div>
    <div id="prow">
      <span id="ptime">00:00</span><span>&gt;</span>
      <input id="q" type="text" placeholder="say anything_" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Say anything">
      <button id="go" aria-label="Run">&#x23ce;</button>
    </div>
  </footer>
</div>
<div id="ov"></div>
